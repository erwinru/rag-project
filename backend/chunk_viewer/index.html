<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Chunk Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --sidebar-bg: #fafafa;
    --hover-bg: #f0f0f0;
    --active-bg: #e8f0fe;
    --active-border: #4a7dfc;
    --code-bg: #f5f5f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e6e6e6;
      --muted: #9aa0a6;
      --border: #2b2f36;
      --sidebar-bg: #1c1f24;
      --hover-bg: #24272d;
      --active-bg: #1f2a3d;
      --active-border: #6c93ff;
      --code-bg: #20232a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    overflow: hidden;
  }

  /* ---- Sidebar ---- */
  #sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #sidebar-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 {
    font-size: 15px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  #sidebar-count {
    font-size: 12px;
    color: var(--muted);
  }
  #search {
    margin: 10px 14px;
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-size: 13px;
  }
  #article-list {
    overflow-y: auto;
    flex: 1;
    padding: 4px 8px 16px;
  }
  .article-item {
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .article-item:hover { background: var(--hover-bg); }
  .article-item.active {
    background: var(--active-bg);
    box-shadow: inset 3px 0 0 var(--active-border);
  }
  .article-item .a-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 3px;
  }
  .article-item .a-meta {
    font-size: 11px;
    color: var(--muted);
  }

  /* ---- Main ---- */
  #main {
    flex: 1;
    height: 100vh;
    overflow-y: auto;
  }
  #empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 14px;
  }
  #article-view { display: none; max-width: 760px; margin: 0 auto; padding: 32px 40px 80px; }
  #article-view.visible { display: block; }

  #a-header h2 {
    font-size: 26px;
    margin: 0 0 8px;
  }
  #a-header .a-sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }

  #legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px;
    margin-bottom: 24px;
    background: var(--code-bg);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px 3px 7px;
    border-radius: 999px;
    font-size: 11px;
    cursor: pointer;
    border: 1px solid transparent;
    background: var(--bg);
    color: var(--fg);
  }
  .legend-chip:hover { border-color: var(--active-border); }
  .legend-swatch {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ---- Content blocks ---- */
  .block {
    padding: 6px 14px;
    margin: 0 0 2px -14px;
    border-left: 4px solid transparent;
    transition: box-shadow 0.2s ease;
  }
  .block.flash {
    box-shadow: 0 0 0 2px var(--active-border) inset;
    border-radius: 4px;
  }
  .block p, .block h2, .block h3, .block h4, .block h5, .block h6 {
    margin: 0;
  }
  .block p { font-size: 15px; line-height: 1.6; }
  .block h2 { font-size: 21px; font-weight: 650; margin-top: 6px; }
  .block h3 { font-size: 18px; font-weight: 620; margin-top: 4px; }
  .block h4 { font-size: 16px; font-weight: 600; }
  .block h5 { font-size: 14.5px; font-weight: 600; color: var(--muted); }
  .block h6 { font-size: 13.5px; font-weight: 600; color: var(--muted); }

  .overlap-badge {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: help;
    vertical-align: middle;
  }

  #chunk-detail {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  #chunk-detail h3 { font-size: 14px; margin-bottom: 10px; }
  .chunk-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .chunk-card .cc-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>Chunk Viewer</h1>
    <div id="sidebar-count">loading...</div>
  </div>
  <input id="search" type="text" placeholder="Filter by title..." />
  <div id="article-list"></div>
</div>

<div id="main">
  <div id="empty-state">Select an article to inspect its chunks</div>
  <div id="article-view">
    <div id="a-header">
      <h2 id="a-title"></h2>
      <div class="a-sub" id="a-sub"></div>
    </div>
    <div id="legend"></div>
    <div id="content"></div>
    <div id="chunk-detail">
      <h3>Chunks</h3>
      <div id="chunk-cards"></div>
    </div>
  </div>
</div>

<script>
const PALETTE = [
  "#4a7dfc", "#e0623d", "#2fa06a", "#c9932e", "#8a5cf5",
  "#d64d8a", "#2aa1a1", "#a35a1e", "#5b6bd6", "#c14545",
  "#3f9e3f", "#9a6bc9",
];

function chunkColor(i) { return PALETTE[i % PALETTE.length]; }

function tint(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

let DATA = null;
let currentSlug = null;

async function boot() {
  const res = await fetch("data.json");
  DATA = await res.json();
  document.getElementById("sidebar-count").textContent =
    `${DATA.articles.length} articles`;
  renderArticleList(DATA.articles);

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = DATA.articles.filter((a) => a.title.toLowerCase().includes(q));
    renderArticleList(filtered);
  });
}

function renderArticleList(articles) {
  const list = document.getElementById("article-list");
  list.innerHTML = "";
  for (const a of articles) {
    const item = document.createElement("div");
    item.className = "article-item" + (a.slug === currentSlug ? " active" : "");
    item.innerHTML = `
      <div class="a-title">${escapeHtml(a.title)}</div>
      <div class="a-meta">#${a.article_number} · ${a.chunks.length} chunks · ${a.word_count} words</div>
    `;
    item.addEventListener("click", () => selectArticle(a.slug));
    list.appendChild(item);
  }
}

function selectArticle(slug) {
  currentSlug = slug;
  const article = DATA.articles.find((a) => a.slug === slug);
  if (!article) return;

  document.querySelectorAll(".article-item").forEach((el) => el.classList.remove("active"));
  renderArticleList(
    document.getElementById("search").value
      ? DATA.articles.filter((a) =>
          a.title.toLowerCase().includes(document.getElementById("search").value.toLowerCase())
        )
      : DATA.articles
  );

  document.getElementById("empty-state").style.display = "none";
  const view = document.getElementById("article-view");
  view.classList.add("visible");

  document.getElementById("a-title").textContent = article.title;
  document.getElementById("a-sub").textContent =
    `${article.author} · ${article.word_count} words · ${article.chunks.length} chunks`;

  // Which chunk "owns" each block number: first chunk (in order) whose
  // content contains that number wins -- an overlap re-appearance in a
  // later chunk doesn't change ownership.
  const owner = new Map();
  const overlapOf = new Map(); // number -> index of the chunk that repeats it as overlap
  article.chunks.forEach((chunk, ci) => {
    for (const block of chunk.content) {
      if (block.number === undefined) continue;
      if (!owner.has(block.number)) {
        owner.set(block.number, ci);
      } else if (owner.get(block.number) !== ci) {
        overlapOf.set(block.number, ci);
      }
    }
  });

  renderLegend(article.chunks);
  renderContent(article.content, owner, overlapOf);
  renderChunkCards(article.chunks);

  view.scrollTop = 0;
  document.getElementById("main").scrollTop = 0;
}

function renderLegend(chunks) {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  chunks.forEach((chunk, i) => {
    const chip = document.createElement("div");
    chip.className = "legend-chip";
    chip.innerHTML = `<span class="legend-swatch" style="background:${chunkColor(i)}"></span>#${i}`;
    chip.title = chunk.id;
    chip.addEventListener("click", () => focusChunk(i));
    legend.appendChild(chip);
  });
}

function renderContent(blocks, owner, overlapOf) {
  const content = document.getElementById("content");
  content.innerHTML = "";
  for (const block of blocks) {
    const ci = owner.get(block.number);
    const color = ci === undefined ? "transparent" : chunkColor(ci);
    const div = document.createElement("div");
    div.className = "block";
    div.dataset.chunk = ci;
    div.style.borderLeftColor = color;
    div.style.background = ci === undefined ? "transparent" : tint(color, 0.08);

    const tag = /^h[1-6]$/.test(block.type) ? block.type : "p";
    const el = document.createElement(tag);
    el.textContent = block.text;
    div.appendChild(el);

    if (overlapOf.has(block.number)) {
      const badge = document.createElement("span");
      badge.className = "overlap-badge";
      badge.textContent = "↻ overlap";
      badge.title = `Also repeated as context at the start of chunk #${overlapOf.get(block.number)}`;
      div.appendChild(badge);
    }

    content.appendChild(div);
  }
}

function renderChunkCards(chunks) {
  const wrap = document.getElementById("chunk-cards");
  wrap.innerHTML = "";
  chunks.forEach((chunk, i) => {
    const card = document.createElement("div");
    card.className = "chunk-card";
    card.style.borderLeftColor = chunkColor(i);
    card.style.borderLeftWidth = "4px";
    const blockCount = chunk.content.length;
    card.innerHTML = `
      <div class="cc-head">
        <span class="legend-swatch" style="background:${chunkColor(i)}"></span>
        <span>${chunk.id}</span>
        <span>· ${blockCount} blocks</span>
      </div>
    `;
    card.addEventListener("click", () => focusChunk(i));
    wrap.appendChild(card);
  });
}

function focusChunk(i) {
  const el = document.querySelector(`.block[data-chunk="${i}"]`);
  if (!el) return;
  el.scrollIntoView({ behavior: "instant", block: "center" });
  document.querySelectorAll(`.block[data-chunk="${i}"]`).forEach((b) => {
    b.classList.add("flash");
    setTimeout(() => b.classList.remove("flash"), 1200);
  });
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

boot();
</script>
</body>
</html>
