# RAG pipeline configuration. Paths are relative to the working directory,
# not to the installed package -- see src/rag/config.py.

[data]
raw_html_dir = "data/raw_html"
pages_csv = "data/pages.csv"
articles_dir = "data/articles"
csv_path = "data/articles.csv"
index_dir = "data/index"

[scrape]
sitemap_url = "https://www.ml6.eu/sitemap.xml"
blog_prefix = "https://www.ml6.eu/en/blog/"
user_agent = "ml6-blog-post RAG/0.1 (one-off research dump; contact: erwin.rudi@gmail.com)"

[chunking]
window_tokens = 500
# How far past the window we're willing to look for the next h2 before giving
# up and just cutting after the last paragraph that fit. See docs/Chunking.md.
heading_search_allowance_tokens = 200
# A raw chunk under this many tokens gets folded into the previous chunk
# instead of standing alone. See docs/Chunking.md.
min_chunk_tokens = 50

[bedrock]
# Matches the region the rest of this project's infrastructure runs in
# (infrastructure/environments/dev/variables.tfvars) -- Bedrock is regional,
# and Titan Text Embeddings V2 must be invoked in a region that offers it.
region = "eu-central-1"
# "adaptive" paces requests based on observed throttling instead of just
# retrying blindly -- Titan Embeddings V2 throttles fast under a tight loop.
max_attempts = 10
retry_mode = "adaptive"

[embedding]
# Which embedding backend embed_text() uses -- "bedrock" (Titan Text
# Embeddings V2, hosted, subject to AWS region/quota access -- see
# docs/Troubleshooting.md) or "huggingface" (local sentence-transformers
# model, no network dependency at query/index time). See docs/Embedding.md.
provider = "huggingface"
collection_name = "ml6_blog"

[embedding.bedrock]
model_id = "amazon.titan-embed-text-v2:0"
dimensions = 1024

[embedding.huggingface]
# Small, well-known sentence-transformers model -- 384-dim, ~90MB, fine on
# CPU. See docs/Embedding.md.
model_id = "sentence-transformers/all-MiniLM-L6-v2"

[retrieval]
# How many chunks to pull from Chroma per question, before handing them to
# the generation model as context. See docs/Retrieval.md.
top_k = 3

[api]
# FastAPI retrieval service (rag.api.app). See docs/API.md.
host = "127.0.0.1"
port = 8000
# Upper bound on the `top_k` a caller may ask for -- the default comes from
# [retrieval].top_k above; this only caps how far a caller can raise it.
max_top_k = 20

[generation]
# Claude Haiku 4.5 has no in-region endpoint in eu-central-1 -- only the EU
# geo cross-region inference profile ("eu." prefix). See docs/Retrieval.md.
model_id = "eu.anthropic.claude-haiku-4-5-20251001-v1:0"
max_tokens = 1024

[evaluation]
# Synthetic QA pairs generated per article via RAGAS's TestsetGenerator.
# Generator embeddings always use config.embedding.huggingface's local
# model for graph construction, independent of config.embedding.provider.
# See docs/Evaluation.md.
ragas_questions_per_article = 5
ragas_output_path = "data/eval/ragas_qa.json"
# How many personas RAGAS infers per article to write questions in the voice
# of. Regenerated per article (personas are derived from that article's own
# chunks), so this is a per-article count, not a corpus-wide one. See
# docs/Evaluation.md.
ragas_personas_per_article = 3
# Which LLM the generator uses -- "bedrock" or "huggingface" (local model,
# no AWS dependency, but noticeably weaker at RAGAS's structured JSON
# prompts -- see docs/Evaluation.md).
generator_llm_provider = "bedrock"

[evaluation.bedrock]
# Qwen3-Coder-30B-A3B-Instruct -- deliberately not Claude Haiku
# (config.generation.model_id): that one's still blocked on the Anthropic
# use-case form (docs/Troubleshooting.md). This is a separately-managed
# AWS/Alibaba model with no such requirement, and is available in-region
# in eu-central-1 (no "eu." cross-region-profile prefix needed, unlike
# Claude Haiku). See docs/Evaluation.md.
model_id = "qwen.qwen3-coder-30b-a3b-v1:0"

[evaluation.huggingface]
# Small-ish, ungated, instruction-tuned model -- picked for reasonable
# JSON-following ability on CPU without needing an HF token. See
# docs/Evaluation.md.
model_id = "Qwen/Qwen2.5-1.5B-Instruct"
max_new_tokens = 512
# "auto" -- accelerate picks MPS/CUDA/CPU automatically. See docs/Evaluation.md.
device_map = "auto"
