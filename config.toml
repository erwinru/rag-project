# RAG pipeline configuration. Paths are relative to the working directory,
# not to the installed package -- see src/rag/config.py.

[data]
raw_html_dir = "data/raw_html"
pages_csv = "data/pages.csv"
articles_dir = "data/articles"
csv_path = "data/articles.csv"
index_dir = "data/index"

[scrape]
sitemap_url = "https://www.ml6.eu/sitemap.xml"
blog_prefix = "https://www.ml6.eu/en/blog/"
user_agent = "ml6-blog-post RAG/0.1 (one-off research dump; contact: erwin.rudi@gmail.com)"

[chunking]
window_tokens = 500
# How far past the window we're willing to look for the next h2 before giving
# up and just cutting after the last paragraph that fit. See docs/Chunking.md.
heading_search_allowance_tokens = 200
# A raw chunk under this many tokens gets folded into the previous chunk
# instead of standing alone. See docs/Chunking.md.
min_chunk_tokens = 50

[bedrock]
# Matches the region the rest of this project's infrastructure runs in
# (infrastructure/environments/dev/variables.tfvars) -- Bedrock is regional,
# and Titan Text Embeddings V2 must be invoked in a region that offers it.
region = "eu-central-1"
# "adaptive" paces requests based on observed throttling instead of just
# retrying blindly -- Titan Embeddings V2 throttles fast under a tight loop.
max_attempts = 10
retry_mode = "adaptive"

[embedding]
# Which embedding backend embed_text() uses -- "bedrock" (Titan Text
# Embeddings V2, hosted, subject to AWS region/quota access -- see
# docs/Troubleshooting.md) or "huggingface" (local sentence-transformers
# model, no network dependency at query/index time). See docs/Embedding.md.
provider = "huggingface"
collection_name = "ml6_blog"

[embedding.bedrock]
model_id = "amazon.titan-embed-text-v2:0"
dimensions = 1024

[embedding.huggingface]
# Small, well-known sentence-transformers model -- 384-dim, ~90MB, fine on
# CPU. See docs/Embedding.md.
model_id = "sentence-transformers/all-MiniLM-L6-v2"

[retrieval]
# How many chunks to pull from Chroma per question, before handing them to
# the generation model as context. See docs/Retrieval.md.
top_k = 3

[generation]
# Claude Haiku 4.5 has no in-region endpoint in eu-central-1 -- only the EU
# geo cross-region inference profile ("eu." prefix). See docs/Retrieval.md.
model_id = "eu.anthropic.claude-haiku-4-5-20251001-v1:0"
max_tokens = 1024
